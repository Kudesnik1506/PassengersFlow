[project]
name = "paxcount"
version = "0.1.0"
description = "Подсчёт пассажиропотока по видео с остановок общественного транспорта"
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.3.0",
    "supervision>=0.25.0",
    "opencv-python>=4.10.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "numpy>=1.26",
    "pydantic>=2.9",
    "typer>=0.15",
    "rich>=13.9",
    "pandas>=2.2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "jinja2>=3.1",
    "lap>=0.5.12",
    "ftfy>=6.3.1",
    "regex>=2026.9.3",
    # Счётная модель (решение 019 разрешает кадрам уходить в API, 024 задаёт
    # конфигурацию). В тестовую группу намеренно не входит: политика прогонов
    # и арбитража проверяется с подставным транспортом, без сети и без ключа —
    # клиент, который можно проверить только настоящим вызовом, проверяется
    # редко, а каждый такой вызов стоит денег заказчика.
    "anthropic>=0.40",
    # Нужен только tools/bake_world_doors.py (Метод A, офлайн-запекание классов
    # YOLOWorld). Ultralytics при первом вызове set_classes() иначе тянет этот
    # же пакет сама, молча, в рантайме — нарушение принципа 6 (цепочка
    # поставки). Пиним коммит явно, вместо неявной установки "с хвоста ветки".
    "clip @ git+https://github.com/ultralytics/CLIP.git@a13192f8cb767260d7dfd98c843b0716593169e7",
]

[dependency-groups]
# Отдельная лёгкая группа под тесты. Смысл: тесты не трогают ни видео, ни веса,
# ни torch — им хватает numpy, pydantic, pandas и rich, а это установка за
# секунды. Полный `uv sync` тянет torch (гигабайты, минуты) и в CI на каждый
# push неоправдан.
#
# Границы версий здесь дублируют [project.dependencies] — это осознанное
# нарушение принципа 2, единственная альтернатива которому «ставить torch ради
# юнит-тестов». Чтобы дубликат не разъехался молча, он проверяется тестом:
# tests/test_packaging.py сверяет обе записи и падает при расхождении.
test = [
    "pytest>=8.0",
    "numpy>=1.26",
    "pydantic>=2.9",
    "pandas>=2.2",
    "rich>=13.9",
]

# Сравнение методов локализации дверей (tools/bench_doors.py). Отдельной
# группой, а не в основных зависимостях: transformers тянет ещё гигабайт, а
# detectron2 собирается из исходников минутами и только с
# `--no-build-isolation` (его setup.py импортирует torch на этапе сборки).
# Боевому конвейеру ничего из этого не нужно — стенд отвечает на разовый
# вопрос «каким методом искать двери», а не работает в смену.
#
# VLPart пакетом не ставится вовсе: репозиторий и веса кладутся руками, см.
# docs и сообщение о готовности в `bench_doors.py --check`.
bench = [
    "transformers>=4.45",
    # Просит VLPart при построении модели (его backbone-обвязка). В его
    # собственных требованиях не объявлен — выяснилось падением на сборке.
    "timm>=1.0",
]

# Проверка веб-экранов живым браузером — `tools/check_markup_ui.py`. Отдельной
# группой: обычным тестам браузер не нужен, а 94 МБ chromium в CI на каждый push
# неоправданны. Заведена после того, как экран разметки уехал за пределы окна у
# владельца — проверять правку интерфейса чужими глазами оказалось дорого. Та же
# проверка поймала и повторение этой поломки при сворачивании панелей.
ui = [
    "playwright>=1.50",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Пакет не устанавливается ради тестов: import идёт прямо из src. Так тесты
# работают и там, где проект не собран (CI без torch).
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paxcount"]
artifacts = ["src/paxcount/webui/*.html"]

[tool.hatch.metadata]
# Нужно для git-зависимости clip, закреплённой на конкретном коммите выше.
allow-direct-references = true

[project.scripts]
paxcount = "paxcount.cli:app"
