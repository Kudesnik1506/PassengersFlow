name: Гейты

# Локальные хуки обходятся флагом --no-verify: git при нём просто не запускает
# хук, и перехватить это изнутри хука нельзя. Поэтому те же проверки продублированы
# здесь — на сервере, где обойти их нельзя. Чтобы этот запуск не был
# рекомендательным, включите в настройках репозитория Branch protection для main
# с обязательным статусом «Гейты».
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gates:
    # Имя job'а, а не workflow, попадает в список обязательных проверок в
    # настройках ветки. Без этой строки проверка называлась бы `gates`, и
    # инструкция «выберите Гейты» не сошлась бы с тем, что видно в интерфейсе.
    name: Гейты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Вся история, а не одна ревизия: записи памяти ссылаются на прежние
          # коммиты, и в клоне глубиной 1 эти ссылки не разрешаются. Гейт умеет
          # распознать мелкий клон и не обвинять понапрасну, но тогда проверка
          # ссылок просто не работает. Репозиторий 3.6 МБ — полная выгрузка
          # ничего не стоит.
          fetch-depth: 0

      # Зависимости проекта (torch, ultralytics) не ставятся сознательно: гейты
      # ниже работают на стандартной библиотеке, а установка ради них заняла бы
      # минуты и мегабайты. Семантические гейты, которым нужны видео и кэш
      # треков, живут в pre-push — кадры не версионируются (персональные данные).
      - name: Синтаксис, размеры, персональные данные, секреты
        run: python3 tools/hooks/gate_syntax.py --rev HEAD

      - name: Разметка дверей
        run: python3 tools/hooks/gate_zones.py

      # Память решений: закрытые словари и сверка каталога. Заголовок записи —
      # JSON, поэтому зависимостей не требует и работает на любом python3.
      - name: Память решений
        run: python3 tools/hooks/gate_memory.py

      # Тесты идут и здесь, а не только в pre-push: дефекты, которые они ловят,
      # по тексту файла не видны, но и данных им не нужно — синтетические сцены
      # из чисел.
      - uses: astral-sh/setup-uv@v5

      # Именно --only-group, а не --group: второй поставил бы ещё и зависимости
      # проекта, то есть torch с ultralytics — минуты и гигабайты на каждый push.
      # Проверено на чистом окружении: 17 пакетов, установка за 0.1 с.
      # Пакет не устанавливается вовсе, import идёт из src (pythonpath в pyproject).
      - name: Тесты
        run: uv run --only-group test pytest

      - name: Напоминание про семантические гейты
        run: |
          echo "Семантические гейты (paxcount check / doors jitter / baseline)"
          echo "выполняются локально в pre-push: им нужны видео и кэш треков,"
          echo "которые не версионируются — см. data/test_videos/SOURCES.md"
