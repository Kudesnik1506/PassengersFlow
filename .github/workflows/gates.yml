name: Гейты

# Локальные хуки обходятся флагом --no-verify: git при нём просто не запускает
# хук, и перехватить это изнутри хука нельзя. Поэтому те же проверки продублированы
# здесь — на сервере, где обойти их нельзя. Чтобы этот запуск не был
# рекомендательным, включите в настройках репозитория Branch protection для main
# с обязательным статусом «Гейты».
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Зависимости проекта (torch, ultralytics) не ставятся сознательно: гейты
      # ниже работают на стандартной библиотеке, а установка ради них заняла бы
      # минуты и мегабайты. Семантические гейты, которым нужны видео и кэш
      # треков, живут в pre-push — кадры не версионируются (персональные данные).
      - name: Синтаксис, размеры, персональные данные, секреты
        run: python3 tools/hooks/gate_syntax.py --rev HEAD

      - name: Разметка дверей
        run: python3 tools/hooks/gate_zones.py

      - name: Напоминание про семантические гейты
        run: |
          echo "Семантические гейты (paxcount check / doors jitter / baseline)"
          echo "выполняются локально в pre-push: им нужны видео и кэш треков,"
          echo "которые не версионируются — см. data/videos/SOURCES.md"
